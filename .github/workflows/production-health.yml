name: NFL PM read-only content health

# Manual only. This is not the strict post-merge release verification workflow.
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Exact reviewed production SHA (blank uses this main run SHA)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: nfl-pm-read-only-health
  cancel-in-progress: false

jobs:
  health:
    if: github.ref == 'refs/heads/main'
    name: Public content integrity and freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-validation.txt
      - name: Read public files; no production access or publication
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
        run: |
          python production_health.py --expected-commit "$EXPECTED_COMMIT" > "$RUNNER_TEMP/content-health.json"
      - name: Report health without claiming deployment verification
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'content-health.json'
          if not path.is_file() or not path.stat().st_size:
              raise SystemExit('Health report unavailable; check job logs. No release action taken.')
          report = json.loads(path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### Read-only content health\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          if report['status'] in {'DEGRADED', 'UNKNOWN'}:
              print('::warning::Content health requires attention; this job does not authorize publication or verify Vercel deployment identity.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfl-pm-content-health-${{ github.run_id }}
          path: ${{ runner.temp }}/content-health.json
          retention-days: 14
          if-no-files-found: error
