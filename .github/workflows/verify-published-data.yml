name: NFL PM post-merge verification

on:
  push:
    branches: [main]
    paths:
      - td-predictor-web/public/data/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-pm-production-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.NFL_PM_VERIFY_DEPLOYMENTS == 'true'
    environment: nfl-pm-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned sidecar validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Wait for exact production revision and verify all JSON hashes
        env:
          NFL_PM_VERIFY_DEPLOYMENTS: ${{ vars.NFL_PM_VERIFY_DEPLOYMENTS }}
          VERCEL_READ_TOKEN: ${{ secrets.NFL_PM_VERCEL_READ_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python verify_publication.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install isolated smoke-test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/nfl-pm-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/nfl-pm-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check production website without deployment credentials
        env:
          NODE_PATH: ${{ runner.temp }}/nfl-pm-browser/node_modules
          BASE_URL: https://onopm.space
        run: node td-predictor-web/scripts/publication-smoke.mjs
      - name: Recheck exact deployment and JSON after browser checks
        env:
          NFL_PM_VERIFY_DEPLOYMENTS: ${{ vars.NFL_PM_VERIFY_DEPLOYMENTS }}
          VERCEL_READ_TOKEN: ${{ secrets.NFL_PM_VERCEL_READ_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python verify_publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nfl-pm-deployment-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-pm-deployment-verification.json
          retention-days: 7
          if-no-files-found: error
      - name: Report verification failure
        if: failure()
        run: echo '::error::Production verification failed. Do not retry publication or claim success. Compare Git and Vercel state; follow the reviewed rollback runbook.'
