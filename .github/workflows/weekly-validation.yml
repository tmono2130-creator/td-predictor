name: NFL PM feature validation

on:
  push:
    branches:
      - feature/nfl-pm-weekly-automation
    paths:
      - .github/workflows/weekly-validation.yml
      - .github/workflows/weekly-predictions.yml
      - weekly_*.py
      - test_*.py
      - requirements-automation.txt
      - td_predictor_v5.py
      - game_breakdown.py
      - export_json.py
      - data_schema.py
      - evaluation_utils.py
      - historical_data.py
      - build_training_data.py
      - td-predictor-web/**

permissions:
  contents: read

concurrency:
  group: nfl-pm-feature-validation
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  NFLREADPY_CACHE: 'off'
  PYTHONUNBUFFERED: '1'

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: td-predictor-web
    steps:
      - name: Checkout approved feature revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        timeout-minutes: 3
        run: npm run lint
      - name: Test snapshot freshness
        timeout-minutes: 2
        run: node --experimental-strip-types --test scripts/freshness.test.mjs
      - name: Build production frontend without deployment
        timeout-minutes: 5
        run: npm run build
      - name: Confirm tracked files are unchanged
        timeout-minutes: 1
        run: git diff --exit-code HEAD -- .

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout approved feature revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install validation dependencies
        timeout-minutes: 10
        run: python -m pip install -r requirements-automation.txt
      - name: Run Python tests
        timeout-minutes: 5
        run: python -m unittest discover -v
      - name: Detect upcoming NFL schedule
        id: plan
        timeout-minutes: 5
        run: python weekly_pipeline.py plan --output "$RUNNER_TEMP/nfl-pm-validation/plan.json"
      - name: Generate unpublished candidate in runner temporary storage
        if: steps.plan.outputs.ready == 'true'
        timeout-minutes: 25
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from weekly_pipeline import main
          from weekly_storage import load_json
          folder = Path(os.environ['RUNNER_TEMP']) / 'nfl-pm-validation'
          plan = load_json(folder / 'plan.json')
          raise SystemExit(main(['generate', '--season', str(plan['season']), '--week', str(plan['week']),
                                 '--candidate', str(folder / 'candidate')]))
          PY
      - name: Validate candidate JSON and existing published references
        if: steps.plan.outputs.ready == 'true'
        timeout-minutes: 5
        run: |
          python weekly_pipeline.py validate --candidate "$RUNNER_TEMP/nfl-pm-validation/candidate"
          python weekly_pipeline.py validate
      - name: Upload temporary validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nfl-pm-feature-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-pm-validation/**/*.json
          if-no-files-found: error
          retention-days: 7
