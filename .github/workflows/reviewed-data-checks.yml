name: NFL PM reviewed data checks

on:
  push:
    branches: [feature/nfl-pm-reviewed-publication]
    paths:
      - .github/workflows/reviewed-data-checks.yml
      - .github/workflows/weekly-predictions.yml
      - .github/workflows/verify-published-data.yml
      - automation_publish.py
      - reviewed_publication.py
      - verify_publication.py
      - test_*.py
      - requirements-automation.txt
      - td-predictor-web/**
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: nfl-pm-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  NFLREADPY_CACHE: 'off'

jobs:
  publication-safety:
    name: Publication safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Validate with trusted base code, never pull_request_target or PR scripts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install trusted-base sidecar validation dependencies
        run: |
          if test -f requirements-validation.txt; then
            python -m pip install -r requirements-validation.txt
          else
            python -m pip install -r requirements-automation.txt
          fi
      - name: Verify current base and data-only contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          subprocess.run(['git', 'fetch', 'origin', head, 'refs/heads/main:refs/remotes/origin/main'], check=True)
          current = subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip()
          base = base or current
          if base != current:
              raise SystemExit('Main advanced: update/regenerate the PR; do not reuse stale checks')
          if Path('reviewed_publication.py').is_file():
              from reviewed_publication import validate_change
              print(validate_change(Path.cwd(), base, head, os.environ['HEAD_BRANCH']))
          else:
              # Bootstrap only: installing this validator may never introduce data.
              changed = subprocess.check_output(['git','diff','--name-only',base,head], text=True).splitlines()
              if any(p.startswith('td-predictor-web/public/data/') for p in changed):
                  raise SystemExit('Trusted-base validator unavailable for data changes')
              print('Source-only bootstrap PR; no production data changed')
          PY
      - name: Validate existing published JSON and manifest references
        run: python weekly_pipeline.py validate

  python-tests:
    name: Python tests
    needs: publication-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-automation.txt
      - run: python -m pip install ruff==0.14.0
      - name: Lint reviewed pipeline source and tests
        run: python -m ruff check --select F weekly_capture.py weekly_data.py validation_tools.py artifact_schema.py test_weekly_data.py weekly_pipeline.py weekly_schedule.py weekly_generation.py weekly_sources.py weekly_storage.py roster_eligibility.py matchup_intelligence.py game_projection_artifact.py game_projection_evaluate.py verify_publication.py
      - run: python -m unittest discover -v
      - name: Verify protected source and original production files
        env:
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python validation_tools.py --base ${{ github.event.pull_request.base.sha || 'origin/main' }} --branch "$REVIEW_BRANCH"
      - name: Prepare isolated synthetic browser fixtures
        run: python validation_tools.py --fixtures "$RUNNER_TEMP/matchup-test-fixtures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matchup-test-fixtures
          path: ${{ runner.temp }}/matchup-test-fixtures/*.json
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend publication build
    needs: [publication-safety, python-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: td-predictor-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --experimental-strip-types --test scripts/*.test.mjs
      - run: npm run build
      - name: Compare protected calculations against reviewed base
        env:
          CALCULATION_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: node scripts/calculation-regression.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: matchup-test-fixtures
          path: ${{ runner.temp }}/matchup-test-fixtures
      - name: Install isolated browser validation tools
        run: |
          npm install --prefix "$RUNNER_TEMP/nfl-pm-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/nfl-pm-browser/node_modules/.bin/playwright" install --with-deps chrome
      - name: Test local production website and both optional features
        env:
          NODE_PATH: ${{ runner.temp }}/nfl-pm-browser/node_modules
          BASE_URL: http://localhost:3158
          PLAYWRIGHT_CHANNEL: chrome
          MATCHUP_FIXTURE_DIR: ${{ runner.temp }}/matchup-test-fixtures
        run: |
          npm run start -- --port 3158 > "$RUNNER_TEMP/nfl-pm-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BASE_URL" > /dev/null
          node scripts/browser-smoke.mjs
          node scripts/publication-smoke.mjs
          node scripts/multi-team-smoke.mjs
          node scripts/game-predictor-smoke.mjs
          node scripts/matchup-smoke.mjs
      - run: git diff --exit-code HEAD -- .

  hosted-capture:
    name: Milestone 9 unpublished capture and replay
    needs: [python-tests, frontend]
    # One trial on this approved same-repository draft PR opening. No schedules,
    # source-update trigger, production environment, credentials or publishing.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      (github.event.pull_request.head.ref == 'feature/nfl-pm-weekly-data-pipeline' ||
       github.event.pull_request.head.ref == 'feature/nfl-pm-week8-launch') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-automation.txt
      - name: Capture fresh pregame inputs and generate all three features
        run: |
          extra=()
          if [ "$GITHUB_HEAD_REF" = 'feature/nfl-pm-week8-launch' ]; then extra=(--season 2026 --week 8); fi
          python weekly_data.py capture-generate --capture "$RUNNER_TEMP/m9-evidence/inputs" --candidate "$RUNNER_TEMP/m9-evidence/candidate" --features all "${extra[@]}"
      - name: Require full coverage and replay exactly from captured bytes
        run: |
          python weekly_data.py replay --capture "$RUNNER_TEMP/m9-evidence/inputs" --candidate "$RUNNER_TEMP/m9-evidence/replay" --features all
          python - <<'PY'
          import json, os
          from pathlib import Path
          from weekly_storage import validate_candidate
          from publication_policy import fresh
          from weekly_schedule import utc_now
          folder = Path(os.environ['RUNNER_TEMP']) / 'm9-evidence'
          result = json.loads((folder / 'inputs/run.json').read_bytes())
          if not result['bundle_status']['three_features']:
              raise SystemExit('Incomplete three-feature capture: ' + str(result['bundle_status']))
          if result['games_expected'] != result['games_generated'] or result['players_expected'] != result['players_generated']:
              raise SystemExit('Coverage mismatch')
          for name in result['artifact_hashes']:
              if (folder / 'candidate' / name).read_bytes() != (folder / 'replay' / name).read_bytes():
                  raise SystemExit('Replay byte mismatch: ' + name)
          board, _, receipt = validate_candidate(folder / 'candidate')
          fresh(board, receipt, utc_now())
          result['injury_uncertainty'] = {
              'unknown_players': sum(r['injury_status'] == 'Unknown' for r in board['rows']),
              'players': len(board['rows']), 'week_report_available': board['meta']['injury_report']['week_available']}
          (folder / 'validation-result.json').write_text(json.dumps(result, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Fresh unpublished capture; exact byte replay verified. No release action.\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: github.head_ref == 'feature/nfl-pm-week8-launch'
        with:
          node-version: '24'
      - name: Build and browser-test the real unpublished Week 8 bundle
        if: github.head_ref == 'feature/nfl-pm-week8-launch'
        working-directory: td-predictor-web
        env:
          BASE_URL: http://localhost:3159
          CANDIDATE_DIR: ${{ runner.temp }}/m9-evidence/candidate
          NODE_PATH: ${{ runner.temp }}/nfl-pm-browser/node_modules
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build | tee "$RUNNER_TEMP/m9-evidence/linux-build.log"
          npm install --prefix "$RUNNER_TEMP/nfl-pm-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/nfl-pm-browser/node_modules/.bin/playwright" install --with-deps chrome
          npm run start -- --hostname 127.0.0.1 --port 3159 > "$RUNNER_TEMP/m9-evidence/browser-server.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BASE_URL" > /dev/null
          node scripts/weekly-data-smoke.mjs | tee "$RUNNER_TEMP/m9-evidence/real-bundle-browser.log"
      - name: Confirm source and production data unchanged
        env:
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python validation_tools.py --base ${{ github.event.pull_request.base.sha }} --branch "$REVIEW_BRANCH"
          git diff --exit-code HEAD
      - name: Retain immutable hosted evidence, including failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milestone-9-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m9-evidence/**
          if-no-files-found: error
          retention-days: 90
