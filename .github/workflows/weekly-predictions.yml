name: NFL PM weekly predictions

# DORMANT: no scheduled event until the owner approves the tested workflow.
# After approval, add under on:
#   schedule:
#     - cron: '17 */6 * 1,9-12 *'
#     - cron: '7,37 0-4,12-23 * 1,9-12 *'
# The schedule-only gate skips offseason and throttles generation by kickoff proximity.
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Optional season; supply week too, or leave both blank for automatic detection'
        type: string
        default: ''
      week:
        description: 'Optional regular-season week (1–18)'
        type: string
        default: ''
      publish:
        description: 'Publish validated JSON (also requires repository opt-in and protected environment)'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: nfl-pm-weekly-publication
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  NFLREADPY_CACHE: 'off'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - id: plan
        name: Resolve real upcoming games without model dependencies
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          python - <<'PY'
          import os
          from weekly_pipeline import main
          args = ['plan', '--output', 'work/weekly-plan.json']
          if os.environ.get('INPUT_SEASON') or os.environ.get('INPUT_WEEK'):
              args += ['--season', str(int(os.environ['INPUT_SEASON'])), '--week', str(int(os.environ['INPUT_WEEK']))]
          if os.environ['GITHUB_EVENT_NAME'] == 'schedule':
              args += ['--due-only']
          raise SystemExit(main(args))
          PY
      - name: Report planning failure
        if: failure()
        run: echo '::error::Schedule retrieval/planning failed. Existing forecasts are unchanged.'

  generate:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - run: python -m pip install -r requirements-automation.txt
      - run: python -m unittest discover -v
      - name: Generate an unpublished candidate using fresh sources
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          python - <<'PY'
          import os
          from weekly_pipeline import main
          args = ['generate', '--candidate', 'work/candidate']
          if os.environ.get('INPUT_SEASON') or os.environ.get('INPUT_WEEK'):
              args += ['--season', str(int(os.environ['INPUT_SEASON'])), '--week', str(int(os.environ['INPUT_WEEK']))]
          raise SystemExit(main(args))
          PY
      - run: python weekly_pipeline.py validate --candidate work/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-candidate
          path: work/candidate/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Report generation failure
        if: failure()
        run: echo '::error::Prediction generation/validation failed. No JSON was published. Inspect the failing source or coverage check.'

  publish:
    needs: generate
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.NFL_PM_PUBLISHING_ENABLED == 'true' &&
      (github.event_name == 'schedule' || inputs.publish == true)
    environment: nfl-pm-production
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - run: python -m pip install -r requirements-automation.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: weekly-candidate
          path: work/candidate
      - name: Verify deployment trigger configuration before any data commit
        env:
          DEPLOYMENT_MODE: ${{ vars.NFL_PM_DEPLOYMENT_MODE }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.NFL_PM_VERCEL_DEPLOY_HOOK }}
        run: |
          python - <<'PY'
          import os
          from automation_publish import validate_hook_url
          mode = os.environ.get('DEPLOYMENT_MODE')
          if mode == 'deploy_hook':
              validate_hook_url(os.environ.get('VERCEL_DEPLOY_HOOK', ''))
          elif mode != 'verified_git':
              raise SystemExit('Configure a deploy hook or independently verify Git integration before publishing')
          PY
      - name: Recheck kickoff and main; publish data paths only
        id: publication
        env:
          NFL_PM_PUBLISHING_ENABLED: ${{ vars.NFL_PM_PUBLISHING_ENABLED }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          GH_PUSH_TOKEN: ${{ github.token }}
        run: python automation_publish.py
      - name: Trigger the configured Vercel main-branch deploy hook
        if: vars.NFL_PM_DEPLOYMENT_MODE == 'deploy_hook'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.NFL_PM_VERCEL_DEPLOY_HOOK }}
        run: |
          python - <<'PY'
          import os
          from automation_publish import trigger_deploy_hook
          trigger_deploy_hook(os.environ['VERCEL_DEPLOY_HOOK'])
          print('Vercel accepted the deployment trigger; verify READY and the production manifest separately.')
          PY
      - name: Publication summary
        env:
          PUBLISHED_SHA: ${{ steps.publication.outputs.published_sha }}
        run: echo "Validated data pushed at $PUBLISHED_SHA. Deployment readiness is verified separately." >> "$GITHUB_STEP_SUMMARY"
      - name: Report publication or deployment-trigger failure
        if: failure()
        run: echo '::error::Publication/trigger failed. Inspect the data commit before retrying. Never force push; no automatic merge or rebase is attempted.'
