name: NFL PM weekly predictions

# DORMANT: no scheduled event until the owner approves the tested workflow.
# Do not add schedules in Milestone 5B. Legacy examples (not active):
#   schedule:
#     - cron: '17 */6 * 1,9-12 *'
#     - cron: '7,37 0-4,12-23 * 1,9-12 *'
# The schedule-only gate skips offseason and throttles generation by kickoff proximity.
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Optional season; supply week too, or leave both blank for automatic detection'
        type: string
        default: ''
      week:
        description: 'Optional regular-season week (1–18)'
        type: string
        default: ''
      publish:
        description: 'Create draft data PR (requires opt-in and protected environment; never merges)'
        type: boolean
        default: false
      diagnostic_only:
        description: 'Read-only gate report; skips generation and PR creation even if publish is checked'
        type: boolean
        default: false
      features:
        description: 'core or complete three-feature bundle; all never falls back to partial data'
        type: choice
        options: [core, all]
        default: core

permissions:
  contents: read
concurrency:
  group: nfl-pm-weekly-publication
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  NFLREADPY_CACHE: 'off'

jobs:
  plan:
    if: inputs.diagnostic_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - id: plan
        name: Resolve real upcoming games without model dependencies
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          python - <<'PY'
          import os
          from weekly_pipeline import main
          args = ['plan', '--output', 'work/weekly-plan.json']
          if os.environ.get('INPUT_SEASON') or os.environ.get('INPUT_WEEK'):
              args += ['--season', str(int(os.environ['INPUT_SEASON'])), '--week', str(int(os.environ['INPUT_WEEK']))]
          if os.environ['GITHUB_EVENT_NAME'] == 'schedule':
              args += ['--due-only']
          raise SystemExit(main(args))
          PY
      - name: Report planning failure
        if: failure()
        run: echo '::error::Schedule retrieval/planning failed. Existing forecasts are unchanged.'

  generate:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - run: python -m pip install -r requirements-automation.txt
      - run: python -m unittest discover -v
      - name: Generate an unpublished candidate using fresh sources
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          FEATURES_REQUESTED: ${{ inputs.features }}
        run: |
          python - <<'PY'
          import os
          from weekly_pipeline import main
          # Optional publication still requires separate explicit opt-ins in the protected job.
          features = os.environ['FEATURES_REQUESTED'] or 'core'
          if features not in {'core', 'all'}:
              raise SystemExit('Unsupported feature selection')
          args = ['generate', '--candidate', 'work/candidate', '--capture', 'work/inputs', '--features', features]
          if os.environ.get('INPUT_SEASON') or os.environ.get('INPUT_WEEK'):
              args += ['--season', str(int(os.environ['INPUT_SEASON'])), '--week', str(int(os.environ['INPUT_WEEK']))]
          raise SystemExit(main(args))
          PY
      - run: python weekly_pipeline.py validate --candidate work/candidate
      - name: Require requested coverage and exact offline replay
        env:
          FEATURES_REQUESTED: ${{ inputs.features }}
        run: |
          python - <<'PY'
          import os
          from automation_publish import validate_requested_bundle
          from weekly_data import main
          from weekly_storage import validate_candidate
          features = os.environ['FEATURES_REQUESTED'] or 'core'
          _, _, receipt = validate_candidate('work/candidate')
          validate_requested_bundle(receipt, features)
          raise SystemExit(main(['replay', '--capture', 'work/inputs', '--candidate', 'work/replay', '--features', features]))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.features == 'all'
        with:
          node-version: '24'
      - name: Browser-check the exact unpublished all-feature proposal
        if: inputs.features == 'all'
        working-directory: td-predictor-web
        env:
          BASE_URL: http://localhost:3159
          CANDIDATE_DIR: ${{ github.workspace }}/work/candidate
          NODE_PATH: ${{ runner.temp }}/nfl-pm-browser/node_modules
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm install --prefix "$RUNNER_TEMP/nfl-pm-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/nfl-pm-browser/node_modules/.bin/playwright" install --with-deps chrome
          npm run start -- --hostname 127.0.0.1 --port 3159 > "$RUNNER_TEMP/weekly-browser-server.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BASE_URL" > /dev/null
          node scripts/weekly-data-smoke.mjs
      - name: Recheck real freshness after browser validation
        run: python weekly_pipeline.py validate --candidate work/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: weekly-input-capture
          path: work/inputs/**
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-candidate
          path: work/candidate/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Report generation failure
        if: failure()
        run: echo '::error::Prediction generation/validation failed. No JSON was published. Inspect the failing source or coverage check.'

  publication-gates:
    name: Read-only publication gate diagnostic
    needs: generate
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report evaluated gates without production access
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only == true }}
          GATE_MAIN: ${{ github.ref == 'refs/heads/main' }}
          GATE_ENABLED: ${{ vars.NFL_PM_PUBLISHING_ENABLED == 'true' }}
          GATE_PUBLISH: ${{ inputs.publish == true }}
          GATE_ORIGINAL: ${{ github.ref == 'refs/heads/main' && vars.NFL_PM_PUBLISHING_ENABLED == 'true' && inputs.publish == true }}
          PUBLISH_VALUE_JSON: ${{ toJSON(inputs.publish) }}
          EVENT_PUBLISH_JSON: ${{ toJSON(github.event.inputs.publish) }}
          ENABLED_VALUE_JSON: ${{ toJSON(vars.NFL_PM_PUBLISHING_ENABLED) }}
          GAME_VALUE_JSON: ${{ toJSON(vars.NFL_PM_GAME_PREDICTOR_ENABLED) }}
          MATCHUP_VALUE_JSON: ${{ toJSON(vars.NFL_PM_MATCHUP_INTELLIGENCE_ENABLED) }}
        run: |
          python3 - <<'PY'
          import json, os
          def observed(key):
              value = json.loads(os.environ[key])
              safe = value is None or type(value) is bool or (isinstance(value, str) and value.strip().lower() in ('', 'true', 'false'))
              return {'type': type(value).__name__, 'value': value if safe else '<non-boolean value redacted>',
                      'length': len(value) if isinstance(value, str) else None}
          def gate(key):
              value = os.environ[key]
              if value not in ('true', 'false'):
                  raise ValueError('Invalid evaluated diagnostic gate: ' + key)
              return value == 'true'
          result = {
              'event': os.environ['EVENT_NAME'], 'ref': os.environ['ACTUAL_REF'],
              'workflow_ref': os.environ['WORKFLOW_REF'], 'workflow_sha': os.environ['WORKFLOW_SHA'],
              'generation_result': os.environ['GENERATE_RESULT'], 'diagnostic_only': gate('DIAGNOSTIC_ONLY'),
              'gates': {'main_ref': gate('GATE_MAIN'), 'repository_publishing_flag': gate('GATE_ENABLED'),
                        'typed_publish_input': gate('GATE_PUBLISH'), 'original_condition': gate('GATE_ORIGINAL')},
              'observations': {key: observed(key) for key in ('PUBLISH_VALUE_JSON', 'EVENT_PUBLISH_JSON',
                              'ENABLED_VALUE_JSON', 'GAME_VALUE_JSON', 'MATCHUP_VALUE_JSON')},
              'scope': 'No production environment: vars observations are repository/organization scope, not environment overrides',
              'note': 'Diagnostic only. True gates do not constitute publication or merge authorization.'}
          print(json.dumps(result, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('### Read-only publication gates\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY

  publish:
    name: Propose reviewed data PR
    needs: [generate, publication-gates]
    if: >-
      inputs.diagnostic_only != true &&
      github.ref == 'refs/heads/main' &&
      vars.NFL_PM_PUBLISHING_ENABLED == 'true' &&
      inputs.publish == true
    environment: nfl-pm-production
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-automation.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: weekly-candidate
          path: ${{ runner.temp }}/nfl-pm-candidate
      - name: Create a draft data-only PR; never merge or deploy
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/nfl-pm-candidate
          NFL_PM_PUBLISHING_ENABLED: ${{ vars.NFL_PM_PUBLISHING_ENABLED }}
          NFL_PM_GAME_PREDICTOR_ENABLED: ${{ vars.NFL_PM_GAME_PREDICTOR_ENABLED }}
          NFL_PM_MATCHUP_INTELLIGENCE_ENABLED: ${{ vars.NFL_PM_MATCHUP_INTELLIGENCE_ENABLED }}
          FEATURES_REQUESTED: ${{ inputs.features }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          GH_PUSH_TOKEN: ${{ github.token }}
        run: python automation_publish.py
      - name: Report PR creation failure
        if: failure()
        run: echo '::error::No main push or deployment was requested. Inspect orphan review branches and PRs before retrying.'
